{% extends "base.html" %}

{% block title %}Registro | Talent Match{% endblock %}

{% block content %}
    <h1>Crear cuenta</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Registrarme</button>
    </form>
    <p>¿Ya tienes cuenta? <a href="{% url 'accounts:login' %}">Inicia sesión</a></p>
{% endblock %}
