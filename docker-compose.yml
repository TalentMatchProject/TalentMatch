services:
  db:
    image: postgres:16
    container_name: talentmatch_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      
  redis:
    image: redis:7
    container_name: talentmatch_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
  