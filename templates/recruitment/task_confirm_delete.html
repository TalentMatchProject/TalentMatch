{% extends "base.html" %}

{% block title %}
Eliminar tarea
{% endblock %}

{% block content %}

<h1>Eliminar tarea</h1>

<p>
    ¿Seguro que quieres eliminar la tarea
    <strong>"{{ task.title }}"</strong>?
</p>

<p>Esta acción no se puede deshacer.</p>

<form method="post">
    {% csrf_token %}

    <button class="btn" type="submit">
        Sí, eliminar
    </button>
</form>

<p>
    <a href="{% url 'recruitment:task_detail' task.pk %}">
        Cancelar
    </a>
</p>

{% endblock %}
